name: Refresh SUIRC-20 index

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: suirc20-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Continue Operation indexer
        env:
          SUIRC20_FLUSH_EVERY: '30'
          SUIRC20_SLEEP_MS: '300'
          # Each Actions run processes a bounded chunk then commits progress
          SUIRC20_MAX_PAGES: '400'
        run: node scripts/suirc20-index.mjs
      - name: Commit if changed
        run: |
          git config user.name 'suicommunity'
          git config user.email 'suicommunity@users.noreply.github.com'
          git add public/suirc20
          if git diff --staged --quiet; then
            echo 'No suirc20 index changes'
          else
            git commit -m "chore: refresh SUIRC-20 Operation index"
            git push
          fi
